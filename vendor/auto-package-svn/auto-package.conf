# ============================================================
# auto-package.conf - 自动打包工具默认配置
# ============================================================
# 使用方法: 将此文件放在与 auto-package.sh 同目录下
# 命令行参数会覆盖此文件中的配置

# ---------- JDK 配置 ----------
# 默认 JDK 路径（可被命令行 -j 参数覆盖）
# 可用版本: jdk1.7.0_80, jdk1.8.0_202, openjdk-21
DEFAULT_JAVA_HOME="D:/Program/Java/jdk1.8.0_202"

# ---------- Ant 配置 ----------
# 默认 Ant 路径（可被命令行 -a 参数覆盖）
DEFAULT_ANT_HOME="E:/devtools/apache-ant-1.10.15-bin/apache-ant-1.10.15"

# ---------- SVN 配置 ----------
# 默认 SVN 用户名和密码（如果 SVN 需要认证）
# 留空表示使用 SVN 默认认证
DEFAULT_SVN_USER=""
DEFAULT_SVN_PASS=""

# ---------- 输出配置 ----------
# 默认输出目录
DEFAULT_OUTPUT_DIR="E:/ProjectPackage"

# 是否合并所有版本到 all/ 目录 (true/false)
MERGE_ALL_VERSIONS="true"

# 是否生成版本说明文件 (true/false)
GEN_README="true"

# ---------- 编译配置 ----------
# 编译时内存上限 (MB)
COMPILE_MEMORY="1024"

# 源码编码
SOURCE_ENCODING="UTF-8"

# ---------- ECJ 编译器配置 ----------
# Eclipse ECJ 编译器 jar 路径（用于对齐 IDE 编译产物字节码，消除 javac vs ECJ 差异）
# 默认使用项目内 lib/ecj-4.6.3.jar，自包含不依赖外部 Tomcat
# ${SCRIPT_DIR} 为 auto-package.sh 所在目录（conf 被 source 时自动展开）
DEFAULT_ECJ_JAR="${SCRIPT_DIR}/lib/ecj-4.6.3.jar"